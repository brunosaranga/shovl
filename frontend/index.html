<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>shovll | break your API before someone else does</title>
        <meta
            name="description"
            content="Break your API before someone else does. Free beta scanner for auth, BOLA, mass assignment, rate limits, data exposure and misconfiguration."
        />

        <!-- Link previews (LinkedIn, X, Slack, WhatsApp). The image is public/og-image.png.
             After changing any of these, paste the site URL into linkedin.com/post-inspector
             so LinkedIn fetches them again. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="shovll" />
        <meta property="og:url" content="https://shovll.com/" />
        <meta property="og:title" content="shovll | break your API before someone else does" />
        <meta property="og:description" content="Free beta API security scanner. Try it on a practice API, no signup needed." />
        <meta property="og:image" content="https://shovll.com/og-image.png" />
        <meta property="og:image:alt" content="The shovll landing page" />
        <meta name="twitter:card" content="summary_large_image" />

        <!-- <link rel="icon" type="image/svg+xml" href="/shovl-logo.svg" /> -->
        <link rel="icon" type="image/svg+xml" href="/src/assets/logos/shovl-logo.svg" />

        <!-- Fonts (Arbutus, Inter, JetBrains Mono) are served by the site itself: src/styles/fonts.css.
             No Google Fonts, so a visit sends nothing to a third party. -->

        <!-- The ground loads first (src/lib/groundFirst.js). Preloaded at high priority, and
             painted by #ground-boot below before the app's JavaScript arrives; the app's own
             ground (layout/Ground) takes over in the same spot and removes #ground-boot.
             Same size and place as Ground.module.css: 400px tall, on the bottom edge, above
             the 64px mobile navbar. -->
        <link rel="preload" as="image" type="image/webp" href="/src/assets/images/ground.webp" fetchpriority="high" />
        <style>
            #ground-boot {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                height: 400px;
                background: url("/src/assets/images/ground.webp") bottom center / cover no-repeat;
                pointer-events: none;
            }
            @media (max-width: 768px) {
                #ground-boot {
                    bottom: 64px;
                }
            }
        </style>

        <!-- Sets the theme before React loads, so dark-mode visitors never see a white flash.
             It is a plain blocking script, so it still runs before the first paint. It lives in
             public/theme-init.js instead of inline so the Content-Security-Policy can allow
             scripts from this site only, with no hash to keep in sync when the script changes. -->
        <script src="/theme-init.js"></script>
    </head>
    <body>
        <div id="ground-boot" aria-hidden="true"></div>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
