<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- meta tags -->
        <meta name="description" content="Break your API before someone else does. Free beta scanner for auth, BOLA, mass assignment, rate limits, data exposure and misconfiguration.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://shovl-3upi.onrender.com/">
        <meta property="og:title" content="shovl | break your API before someone else does">
        <meta property="og:description" content="Free beta API security scanner. Try it on a practice API, no signup needed.">
        <meta property="og:image" content="https://shovl-3upi.onrender.com/og-image.png">
        <meta name="twitter:card" content="summary_large_image">
        
        <!-- <link rel="icon" type="image/svg+xml" href="/shovl-logo.svg" /> -->
        <link rel="icon" type="image/svg+xml" href="/src/assets/logos/shovl-logo.svg" />        <title>shovl | break your API before someone else does</title>
        <meta
            name="description"
            content="Paste an API URL and shovl checks it for the OWASP API Top 10 basics: authentication, object access, data exposure, rate limits and more."
        />

        <!-- Fonts used by tokens.css (--font-display, --font-sans).
             --font-mono asks for JetBrains Mono, which is not loaded here, so most
             visitors see the Courier fallback. Add "&family=JetBrains+Mono:wght@400;700;800"
             to this URL if you want JetBrains Mono everywhere. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Arbutus&family=Inter:wght@400;700;900&display=swap"
            rel="stylesheet"
        />

        <!-- Set the theme before React loads, so dark-mode visitors never see a white flash.
             Saved choice first, then the system setting. ThemeContext takes over from here. -->
        <script>
            (function () {
                var theme = "light";
                try {
                    var saved = localStorage.getItem("shovl.theme");
                    if (saved === "light" || saved === "dark") {
                        theme = saved;
                    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                        theme = "dark";
                    }
                } catch (e) {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
