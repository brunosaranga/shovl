<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- First: the old addresses (Render's, shovll.com) forward to xikomu.com (public/canonical-host.js). -->
        <script src="/canonical-host.js"></script>
        <title>xikomu | break your API before someone else does</title>
        <meta
            name="description"
            content="Break your API before someone else does. Free beta scanner for auth, BOLA, mass assignment, rate limits, data exposure and misconfiguration."
        />
        <!-- The address search engines should list. The public pages get their own copy of this
             <head> at build time, with their own title, description and addresses
             (scripts/seo-pages.mjs): keep these tags on one line each, as they are, so it can
             find them. -->
        <link rel="canonical" href="https://xikomu.com/" />

        <!-- Link previews (LinkedIn, X, Slack, WhatsApp). The image is public/og-image-pickaxe.jpg:
             1200 x 627 and about 100 KB. Keep it a JPEG well under 300 KB: WhatsApp shows no
             preview image above that (the old 712 KB PNG worked on LinkedIn only). If you
             replace it, give it a new file name, since apps cache previews by image address,
             and keep the width and height tags in step. Then paste the site URL into
             linkedin.com/post-inspector so LinkedIn fetches them again. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="xikomu" />
        <meta property="og:url" content="https://xikomu.com/" />
        <meta property="og:title" content="xikomu | break your API before someone else does" />
        <meta property="og:description" content="Free beta API security scanner. Try it on a practice API, no signup needed." />
        <meta property="og:image" content="https://xikomu.com/og-image-pickaxe.jpg" />
        <meta property="og:image:secure_url" content="https://xikomu.com/og-image-pickaxe.jpg" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="627" />
        <meta property="og:image:alt" content="The xikomu landing page" />
        <meta name="twitter:card" content="summary_large_image" />

        <!-- The xikomu pickaxe. Fixed addresses (public/), so search results and bookmarks keep
             finding it: SVG for browsers, a 48 px .ico for everything else (Google wants a
             multiple of 48), and the home-screen icon for phones. favicon.svg turns its ink white
             when the system is in dark mode; the .ico and the home-screen icon sit on a dark tile,
             so they show on any background. -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

        <!-- Who and what the site is, for search engines: the site's name ("xikomu", shown
             above the result) and the brand behind it. A data block, not a script: browsers
             don't run it, so the Content-Security-Policy is unaffected. -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "WebSite",
                        "@id": "https://xikomu.com/#website",
                        "name": "xikomu",
                        "alternateName": "xikomu.com",
                        "url": "https://xikomu.com/",
                        "publisher": { "@id": "https://xikomu.com/#organization" }
                    },
                    {
                        "@type": "Organization",
                        "@id": "https://xikomu.com/#organization",
                        "name": "xikomu",
                        "url": "https://xikomu.com/",
                        "logo": "https://xikomu.com/logo-512.png",
                        "email": "support@xikomu.com",
                        "description": "xikomu is an API security scanner: it breaks your API before someone else does."
                    }
                ]
            }
        </script>

        <!-- Fonts (Arbutus, Inter, JetBrains Mono) are served by the site itself: src/styles/fonts.css.
             No Google Fonts, so a visit sends nothing to a third party. -->

        <!-- The ground loads first (src/lib/groundFirst.js). Preloaded at high priority, and
             painted by #ground-boot below before the app's JavaScript arrives; the app's own
             ground (layout/Ground) takes over in the same spot and removes #ground-boot.
             Same size and place as Ground.module.css: 400px tall, on the bottom edge, above
             the 64px mobile navbar. -->
        <link rel="preload" as="image" type="image/webp" href="/src/assets/images/ground.webp" fetchpriority="high" />
        <style>
            #ground-boot {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                height: 400px;
                background: url("/src/assets/images/ground.webp") bottom center / cover no-repeat;
                pointer-events: none;
            }
            @media (max-width: 768px) {
                #ground-boot {
                    bottom: 64px;
                }
            }
        </style>

        <!-- Sets the theme before React loads, so dark-mode visitors never see a white flash.
             It is a plain blocking script, so it still runs before the first paint. It lives in
             public/theme-init.js instead of inline so the Content-Security-Policy can allow
             scripts from this site only, with no hash to keep in sync when the script changes. -->
        <script src="/theme-init.js"></script>
    </head>
    <body>
        <noscript>
            <p>
                xikomu is a free beta API security scanner: it checks your API for broken authentication, BOLA,
                mass assignment, missing rate limits, data exposure and misconfiguration. Turn on JavaScript to
                use it. <a href="/pricing">pricing</a> · <a href="/terms">terms</a> · <a href="/privacy">privacy</a>
                · <a href="/refunds">refunds</a>
            </p>
        </noscript>
        <div id="ground-boot" aria-hidden="true"></div>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
