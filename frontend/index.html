<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>shovl | break your API before someone else does</title>
        <meta
            name="description"
            content="Break your API before someone else does. Free beta scanner for auth, BOLA, mass assignment, rate limits, data exposure and misconfiguration."
        />

        <!-- Link previews (LinkedIn, X, Slack, WhatsApp). The image is public/og-image.png.
             After changing any of these, paste the site URL into linkedin.com/post-inspector
             so LinkedIn fetches them again. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="shovl" />
        <meta property="og:url" content="https://shovl-3upi.onrender.com/" />
        <meta property="og:title" content="shovl | break your API before someone else does" />
        <meta property="og:description" content="Free beta API security scanner. Try it on a practice API, no signup needed." />
        <meta property="og:image" content="https://shovl-3upi.onrender.com/og-image.png" />
        <meta property="og:image:alt" content="The shovl landing page" />
        <meta name="twitter:card" content="summary_large_image" />

        <!-- <link rel="icon" type="image/svg+xml" href="/shovl-logo.svg" /> -->
        <link rel="icon" type="image/svg+xml" href="/src/assets/logos/shovl-logo.svg" />

        <!-- Fonts used by tokens.css: Arbutus and Inter (display and body), JetBrains Mono (--font-mono). -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Arbutus&family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap"
            rel="stylesheet"
        />

        <!-- Sets the theme before React loads, so dark-mode visitors never see a white flash.
             It is a plain blocking script, so it still runs before the first paint. It lives in
             public/theme-init.js instead of inline so the Content-Security-Policy can allow
             scripts from this site only, with no hash to keep in sync when the script changes. -->
        <script src="/theme-init.js"></script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
