# Daily cleanup: deletes guest accounts (and their scans) 30 days after they were created,
# as the site promises guests. Runs on GitHub's free runners, about a minute a day out of
# the 2,000 free minutes a month that private repositories get.
#
# Needs one repository secret, DATABASE_URL: the Neon connection string
# (GitHub: Settings > Secrets and variables > Actions > New repository secret).
name: Purge old guests

on:
    schedule:
        - cron: "0 3 * * *"         # every day at 03:00 UTC (05:00 in Maputo)
    workflow_dispatch:               # adds a "Run workflow" button for running it by hand

permissions:
    contents: read

concurrency:
    group: purge-guests
    cancel-in-progress: false

jobs:
    purge:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: backend/shovl
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: backend/shovl/requirements.txt

            - name: Install
              run: pip install -r requirements.txt

            - name: Delete guests older than 30 days
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  # Production settings insist on these. The cleanup serves no web pages, so
                  # their values do not matter here, and the secret key is a throwaway one.
                  DJANGO_ALLOWED_HOSTS: shovl-api.onrender.com
                  CORS_ALLOWED_ORIGINS: https://shovl.onrender.com
              run: |
                  export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
                  python manage.py purge_guests
